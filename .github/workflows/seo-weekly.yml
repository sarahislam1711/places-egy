# Every Monday: checks robots.txt, sitemap sizes, a sample of indexable pages
# and the known 301 redirects on the live site. A failure turns the run red
# (GitHub e-mails watchers) and opens an issue labelled "monitoring".
name: Weekly SEO check
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SEO check
        run: node scripts/seo-check.mjs https://places-egy.com | tee seo-check.txt; exit ${PIPESTATUS[0]}
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('seo-check.txt') ? fs.readFileSync('seo-check.txt', 'utf8').split('\n').filter(l => l.startsWith('FAIL')).join('\n').slice(0, 3000) : '(no output)';
            const title = 'Weekly SEO check failing';
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${out}\n\`\`\``;
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'monitoring' });
            const open = data.find(i => i.title === title);
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['monitoring'] });
